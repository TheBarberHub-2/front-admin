<div class="form-wrapper">
    <h2>Login</h2>
    <form [formGroup]="loginForm" (ngSubmit)="onSubmitLogin()">
        <div class="form-group">
            <label for="usuario">Usuario *</label>
            <input type="text" id="usuario" formControlName="usuario"
                [class.error]="loginForm.get('usuario')?.invalid && loginForm.get('usuario')?.touched" />
            @if (loginForm.get('usuario')?.invalid && loginForm.get('usuario')?.touched) {
            <span class="error-message">
                El usuario es requerido
            </span>
            }
        </div>
        <div class="form-group">
            <label for="contraseña">Contraseña *</label>
            <input type="password" id="contraseña" formControlName="contraseña"
                [class.error]="loginForm.get('contraseña')?.invalid && loginForm.get('contraseña')?.touched" />
            @if (loginForm.get('contraseña')?.invalid && loginForm.get('contraseña')?.touched) {
            <span class="error-message">
                La contraseña es requerida
            </span>
            }
        </div>
        <button type="submit" [disabled]="loginForm.invalid">Iniciar Sesión</button>
    </form>
</div>
